<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso denegado | [PHOTO]</title>

  <link rel="stylesheet" type="text/css" th:href="@{/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/font-awesome/css/font-awesome.min.css}">
</head>

<body>

  <main class="auth-page">
    <div class="auth-card access-denied-card">
      <div class="access-denied-icon">
        <i class="fa fa-lock"></i>
      </div>

      <h1>403 - Acceso denegado</h1>
      <p class="auth-subtitle">
        No tienes permisos para acceder a esta página.
        <span sec:authorize="isAuthenticated()">
          Has iniciado sesión como <strong sec:authentication="name">usuario</strong>.
        </span>
      </p>

      <div class="alert alert-warning" role="alert">
        <i class="fa fa-exclamation-triangle"></i>
        Esta zona está reservada a usuarios con rol de administrador.
      </div>

      <a th:href="@{/}" class="btn btn-primary btn-block">
        <i class="fa fa-home"></i> Volver al inicio
      </a>

      <form th:action="@{/logout}" method="post" class="access-denied-logout">
        <button type="submit" class="btn btn-default btn-block">
          <i class="fa fa-sign-out"></i> Cerrar sesión
        </button>
      </form>

      <p class="auth-footer">
        <a th:href="@{/contact}"><i class="fa fa-envelope"></i> Contactar con el administrador</a>
      </p>
    </div>
  </main>

  <script type="text/javascript" th:src="@{/js/jquery.min.js}"></script>
  <script type="text/javascript" th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
</body>

</html>
