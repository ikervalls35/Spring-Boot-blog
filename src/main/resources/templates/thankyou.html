<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gracias por tu mensaje | [PHOTO]</title>

  <link rel="stylesheet" type="text/css" th:href="@{/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/font-awesome/css/font-awesome.min.css}">
</head>

<body>

  <main class="auth-page">
    <div class="auth-card thankyou-card">
      <div class="thankyou-icon">
        <i class="fa fa-check"></i>
      </div>
      <h1>¡Gracias!</h1>
      <p class="auth-subtitle">Tu mensaje se ha enviado correctamente. Nos pondremos en contacto contigo lo antes posible.</p>

      <a th:href="@{/}" class="btn btn-primary btn-block">
        <i class="fa fa-home"></i> Volver al inicio
      </a>
      <p class="auth-footer">
        <a th:href="@{/contact}"><i class="fa fa-arrow-left"></i> Enviar otro mensaje</a>
      </p>
    </div>
  </main>

  <script type="text/javascript" th:src="@{/js/jquery.min.js}"></script>
  <script type="text/javascript" th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
</body>

</html>
