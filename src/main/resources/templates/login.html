<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | [PHOTO]</title>

  <link rel="stylesheet" type="text/css" th:href="@{/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/font-awesome/css/font-awesome.min.css}">
</head>

<body>

  <main class="auth-page">
    <div class="auth-card">
      <a class="auth-brand" th:href="@{/}"><span>[</span>PHOTO<span>]</span></a>
      <h1>Iniciar sesión</h1>
      <p class="auth-subtitle">Accede para publicar y gestionar el blog.</p>

      <div th:if="${param.error}" class="alert alert-danger" role="alert">
        <i class="fa fa-exclamation-triangle"></i> Usuario/email o contraseña incorrectos.
      </div>

      <div th:if="${param.registered}" class="alert alert-success" role="alert">
        <i class="fa fa-check-circle"></i> Tu cuenta se ha creado correctamente. Ya puedes iniciar sesión.
      </div>

      <div th:if="${param.logout}" class="alert alert-success" role="alert">
        <i class="fa fa-check-circle"></i> Has cerrado sesión correctamente.
      </div>

      <form th:action="@{/login}" method="post">
        <div class="form-group">
          <label for="username">Usuario o email</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Introduce tu usuario o email"
            autocomplete="username" required autofocus>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Introduce tu contraseña"
            autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <i class="fa fa-sign-in"></i> Entrar
        </button>
      </form>

      <p class="auth-footer">
        ¿No tienes cuenta? <a th:href="@{/register}">Crear una cuenta</a>
      </p>
      <p class="auth-footer auth-footer-secondary">
        <a th:href="@{/}"><i class="fa fa-arrow-left"></i> Volver a la web</a>
      </p>
    </div>
  </main>

  <script type="text/javascript" th:src="@{/js/jquery.min.js}"></script>
  <script type="text/javascript" th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
</body>

</html>
