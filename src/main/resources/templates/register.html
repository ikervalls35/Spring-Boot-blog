<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | [PHOTO]</title>

  <link rel="stylesheet" type="text/css" th:href="@{/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/font-awesome/css/font-awesome.min.css}">
</head>

<body>

  <main class="auth-page">
    <div class="auth-card auth-card-wide">
      <a class="auth-brand" th:href="@{/}"><span>[</span>PHOTO<span>]</span></a>
      <h1>Crear cuenta</h1>
      <p class="auth-subtitle">Regístrate para publicar entradas y participar en el blog.</p>

      <form th:action="@{/register}" th:object="${registerForm}" method="post" novalidate>

        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
          <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="mb-0"></p>
        </div>

        <div class="form-group">
          <label for="name">Nombre</label>
          <input type="text" id="name" th:field="*{name}" class="form-control"
                 placeholder="Tu nombre" autocomplete="name" required>
          <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" th:field="*{username}" class="form-control"
                 placeholder="Elige un nombre de usuario" autocomplete="username" required>
          <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" th:field="*{email}" class="form-control"
                 placeholder="tu@email.com" autocomplete="email" required>
          <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="row">
          <div class="col-sm-6">
            <div class="form-group">
              <label for="password">Contraseña</label>
              <input type="password" id="password" th:field="*{password}" class="form-control"
                     placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
              <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>
          </div>
          <div class="col-sm-6">
            <div class="form-group">
              <label for="confirmPassword">Repetir contraseña</label>
              <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                     placeholder="Repite la contraseña" autocomplete="new-password" required>
              <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}"
                    th:errors="*{confirmPassword}"></span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <div class="checkbox">
            <label>
              <input type="checkbox" th:field="*{terms}" required>
              Acepto los términos y condiciones
            </label>
          </div>
          <span class="field-error" th:if="${#fields.hasErrors('terms')}" th:errors="*{terms}"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <i class="fa fa-user-plus"></i> Registrarme
        </button>
      </form>

      <p class="auth-footer">
        ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
      </p>
      <p class="auth-footer auth-footer-secondary">
        <a th:href="@{/}"><i class="fa fa-arrow-left"></i> Volver a la web</a>
      </p>
    </div>
  </main>

  <script type="text/javascript" th:src="@{/js/jquery.min.js}"></script>
  <script type="text/javascript" th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
</body>

</html>
